[project]
name = "customer-churn-aws-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "deepattic", email = "148025215+deepattic@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.103",
    "dotenv>=0.9.9",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "xgboost>=3.4.1",
]

[project.scripts]
customer-churn-aws-project = "customer_churn_aws_project:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.16.9",
]
